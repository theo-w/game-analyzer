<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找回密码 - Game Analyzer</title>
  <link rel="stylesheet" href="/static/css/theme.css">
    <style>
    body { font-family: system-ui, sans-serif; background: #f5f5f7; color: #1d1d1f; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #ffffff; border: 1px solid #d2d2d7; border-radius: 12px; padding: 28px; width: 100%; max-width: 420px; }
    h1 { margin: 0 0 8px; font-size: 1.4rem; }
    p { color: #6e6e73; font-size: 0.9rem; }
    label { display: block; margin: 16px 0 6px; font-size: 0.85rem; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #86868b; background: #f5f5f7; color: #fff; }
    button { margin-top: 18px; width: 100%; padding: 12px; border: none; border-radius: 8px; background: #0071e3; color: #fff; font-weight: 600; cursor: pointer; }
    .msg { margin-top: 12px; font-size: 0.9rem; white-space: pre-wrap; word-break: break-all; }
    .err { color: #dc2626; }
    .ok { color: #16a34a; }
    a { color: #0071e3; }
  </style>
</head>
<body>
  <div class="card">
    <h1>找回密码</h1>
    <p>输入注册邮箱，我们将提供重置方式（开发环境会直接显示重置链接）。</p>
    <form id="forgot-form">
      <label for="email">注册邮箱</label>
      <input id="email" type="email" required placeholder="you@example.com">
      <button type="submit">发送重置说明</button>
    </form>
    <p class="msg" id="msg"></p>
    <p style="margin-top:16px;"><a href="/login">返回登录</a></p>
  </div>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const msgEl = document.getElementById('msg');
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      let text = data.message || '请求已提交';
      if (data.dev_reset_url) {
        text += '\n\n开发环境重置链接：\n' + data.dev_reset_url;
      }
      msgEl.textContent = text;
      msgEl.className = 'msg ok';
    });
  </script>
</body>
</html>
