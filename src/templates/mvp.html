
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Analyzer MVP</title>
  <link rel="stylesheet" href="/static/css/analysis-guide.css">
  <link rel="stylesheet" href="/static/css/app-nav.css">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1d2433;
      --muted: #657083;
      --line: #dfe4ea;
      --accent: #136f63;
      --accent-2: #b54708;
      --ok: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }
    .wrap {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
    }
    .topbar {
      min-height: 84px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: 0;
    }
    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    button, a.button {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
      min-height: 38px;
      padding: 0 12px;
      border-radius: 6px;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    main { padding: 24px 0 36px; }
    .status {
      min-height: 24px;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 14px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .metric, .panel, .game {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .metric { padding: 16px; min-height: 92px; }
    .label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .value {
      font-size: 28px;
      line-height: 1.1;
      font-weight: 760;
      letter-spacing: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 16px;
      align-items: start;
    }
    .strategy-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .strategy-item {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      min-height: 112px;
    }
    .strategy-item h3 {
      margin: 0 0 8px;
      font-size: 15px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .panel { padding: 18px; }
    .panel h2, .game h2 {
      margin: 0 0 14px;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .games {
      display: grid;
      gap: 12px;
    }
    .game { padding: 18px; }
    .game-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 0 9px;
      background: #e9f7f4;
      color: var(--ok);
      font-size: 13px;
      white-space: nowrap;
    }
    .badge.warn {
      background: #fff4e6;
      color: var(--accent-2);
    }
    .split {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .mini {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      min-height: 70px;
    }
    .mini strong { display: block; font-size: 18px; margin-top: 4px; }
    ul { margin: 8px 0 0; padding-left: 18px; }
    li { margin: 7px 0; color: #2c3442; }
    .checks {
      display: grid;
      gap: 8px;
    }
    .check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      padding: 9px 0;
      font-size: 14px;
    }
    .check:last-child { border-bottom: 0; }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--ok);
      margin-top: 4px;
      flex: 0 0 auto;
    }
    code {
      background: #eef1f5;
      border-radius: 5px;
      padding: 2px 5px;
      font-size: 13px;
    }
    .empty {
      padding: 24px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
    }
    .filter-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px 18px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 14px 16px;
      align-items: end;
    }
    .filter-panel label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .filter-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text);
    }
    .filter-toggle input {
      width: auto;
      min-height: auto;
      margin: 0;
    }
    .filter-panel select,
    .filter-panel input[type="number"] {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
    }
    .filter-panel select:disabled,
    .filter-panel input[type="number"]:disabled {
      opacity: 0.55;
      background: #f3f4f6;
      cursor: not-allowed;
    }
    #product-picker {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fafbfc;
    }
    .product-picker-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .product-picker-item:hover { background: #eef1f5; }
    .product-picker-name { flex: 1; }
    .product-picker-genre {
      font-size: 11px;
      color: var(--muted);
      background: #eef1f5;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .product-picker-empty { font-size: 13px; color: var(--muted); margin: 0; }
    .filter-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-hint {
      grid-column: 1 / -1;
      font-size: 13px;
      color: var(--muted);
      margin: 0;
    }
    #product-select { display: none; }
    @media (max-width: 860px) {
      .filter-panel { grid-template-columns: 1fr; }
      .topbar, .game-head { align-items: stretch; flex-direction: column; }
      .actions { justify-content: flex-start; }
      .metrics, .grid, .split, .strategy-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="app-topbar app-topbar-dark">
    <div class="app-topbar-left">
      <a class="app-topbar-logo" href="/">🎮</a>
      <div id="app-nav-mount" data-active="mvp"></div>
    </div>
    <div class="app-topbar-right">
      <h1 style="font-size:0.95rem;margin:0;">Game Analyzer MVP</h1>
      <button class="button" type="button" data-sitemap-open title="帮助与指引">📖 指引</button>
      <a class="button" href="/api/mvp/latest" target="_blank">查看 JSON</a>
    </div>
  </header>
  <main class="wrap">
    <div id="mvp-advanced-notice"></div>
    <section class="filter-panel" aria-label="筛选条件">
      <div id="crawl-progress-wrap" style="grid-column:1/-1;display:none;margin-bottom:4px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px;">
          <span id="crawl-progress-label">抓取进度</span>
          <span id="crawl-progress-percent">0%</span>
        </div>
        <div style="height:8px;background:#eef1f5;border-radius:999px;overflow:hidden;">
          <div id="crawl-progress-bar" style="height:100%;width:0%;background:var(--accent);transition:width .25s ease;"></div>
        </div>
      </div>
      <div>
        <label for="channel-select">渠道 / 数据来源</label>
        <select id="channel-select">
          <option value="steam">Steam</option>
        </select>
        <p id="channel-product-hint" class="filter-hint" style="margin:6px 0 0;"></p>
      </div>
      <div>
        <label for="market-country">国家 / 地区</label>
        <select id="market-country" class="filter-select"></select>
        <p class="filter-hint" style="margin:6px 0 0; grid-column:auto;">
          决定渠道商店与评论的区域版本（Google Play 区服、TapTap 站点、Steam 评论语言）。
        </p>
      </div>
      <div style="grid-column: 1 / -1;">
        <label>产品选择（单击勾选，可多选）</label>
        <div id="product-picker"></div>
        <select id="product-select" multiple></select>
      </div>
      <div>
        <label class="filter-toggle" for="use-review-days">
          <input type="checkbox" id="use-review-days" checked>
          按时间范围筛选
        </label>
        <select id="review-days" class="filter-select">
          <option value="7">近 7 天</option>
          <option value="14">近 14 天（半个月）</option>
          <option value="30" selected>近 30 天</option>
        </select>
        <p class="filter-hint" style="margin:6px 0 0; grid-column:auto;">
          按评论<strong>发布日期</strong>过滤；可与条数限制组合使用。
        </p>
      </div>
      <div>
        <label class="filter-toggle" for="use-max-reviews">
          <input type="checkbox" id="use-max-reviews">
          限制评价数量
        </label>
        <input id="max-reviews" type="number" min="1" step="1" value="1000" disabled>
        <p class="filter-hint" style="margin:6px 0 0; grid-column:auto;">
          无系统上限，按你填写的条数抓取；可只勾此项（不按日期），恢复「最新 N 条」模式。
        </p>
      </div>
      <div style="grid-column: 1 / -1; border-top: 1px dashed var(--line); padding-top: 12px;">
        <label for="new-product-name">新增游戏产品（与上方列表独立的新游戏）</label>
        <div style="display:grid; grid-template-columns: 1.2fr 1fr auto; gap:8px; align-items:end;">
          <input id="new-product-name" type="text" placeholder="游戏名称，如 Last Beacon" style="min-height:38px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;">
          <input id="new-product-id" type="text" placeholder="推荐：Play 商店链接或包名（如 com.GlobalSoFunny.Sausage）" style="min-height:38px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;">
          <button id="add-product" type="button">添加产品</button>
        </div>
        <p class="filter-hint" style="margin:6px 0 0;">添加后会出现在上方产品列表（标注「自定义」），勾选后点「重新抓取」即可拉取该游戏数据。</p>
      </div>
      <div class="filter-actions">
        <button id="apply-filter" type="button">应用筛选</button>
        <button id="refresh" class="primary" type="button">重新抓取</button>
      </div>
      <p id="filter-hint" class="filter-hint">加载产品列表…</p>
    </section>
    <div id="status" class="status">正在读取最新 MVP 结果...</div>
    <section id="content"></section>
  </main>
  <script src="/static/js/data-flow-guide.js"></script>
  <script src="/static/js/analysis-guide.js"></script>
  <script src="/static/js/site-map-panel.js" defer></script>
  <script src="/static/js/product-picker.js"></script>
  <script src="/static/js/auth-token.js"></script>
  <script src="/static/js/app-nav.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');
    const refreshButton = document.getElementById('refresh');
    const filterHintEl = document.getElementById('filter-hint');
    const channelSelect = document.getElementById('channel-select');
    let lastPayload = null;
    let catalogProducts = [];
    let defaultByChannel = {};
    let marketsByChannel = {};
    let defaultMarketByChannel = {};

    function mvpAuthToken() {
      return typeof getAuthToken === 'function' ? getAuthToken() : localStorage.getItem('access_token');
    }

    function mvpAuthQuery() {
      const token = mvpAuthToken();
      return token ? `token=${encodeURIComponent(token)}` : '';
    }

    function mvpAuthHeaders() {
      const token = mvpAuthToken();
      const headers = {};
      if (token) headers.Authorization = `Bearer ${token}`;
      return headers;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function selectedProductIds() {
      if (window.ProductPicker) {
        return ProductPicker.getSelectedIds();
      }
      const sel = document.getElementById('product-select');
      if (!sel) return [];
      return Array.from(sel.selectedOptions).map((o) => o.value).filter(Boolean);
    }

    function selectedChannel() {
      return (channelSelect && channelSelect.value) || 'steam';
    }

    function selectedMarketCountry() {
      const channel = selectedChannel();
      const select = document.getElementById('market-country');
      if (select && select.value) return select.value;
      return defaultMarketByChannel[channel] || 'us';
    }

    function renderMarketSelect(channel) {
      const select = document.getElementById('market-country');
      if (!select) return;
      const ch = channel || selectedChannel();
      const markets = marketsByChannel[ch] || [];
      const defaultMarket = defaultMarketByChannel[ch] || 'us';
      const previous = select.value;
      select.innerHTML = markets.map((market) =>
        `<option value="${escapeHtml(market.id)}">${escapeHtml(market.label)}</option>`
      ).join('');
      const preferred = markets.some((market) => market.id === previous) ? previous : defaultMarket;
      if (markets.some((market) => market.id === preferred)) {
        select.value = preferred;
      }
      select.disabled = !markets.length || ch === 'app_store';
    }

    function describeMarket(dataset) {
      if (dataset && dataset.market_label) return dataset.market_label;
      const select = document.getElementById('market-country');
      return select?.selectedOptions?.[0]?.textContent || '';
    }

    function syncCrawlFilterControls() {
      const useDays = document.getElementById('use-review-days')?.checked;
      const useCount = document.getElementById('use-max-reviews')?.checked;
      const daysEl = document.getElementById('review-days');
      const countEl = document.getElementById('max-reviews');
      if (daysEl) daysEl.disabled = !useDays;
      if (countEl) countEl.disabled = !useCount;
    }

    function describeCrawlFilters(dataset) {
      if (dataset && dataset.filter_label) return dataset.filter_label;
      const parts = [];
      const useDays = dataset ? dataset.use_review_days !== false : true;
      const useCount = Boolean(dataset && dataset.use_max_reviews);
      if (useDays && dataset && dataset.review_days) {
        const dayLabels = { 7: '近 7 天', 14: '近 14 天', 30: '近 30 天' };
        parts.push(dayLabels[dataset.review_days] || `近 ${dataset.review_days} 天`);
      } else if (useDays) {
        const reviewDays = parseInt(document.getElementById('review-days')?.value || '30', 10) || 30;
        const dayLabels = { 7: '近 7 天', 14: '近 14 天', 30: '近 30 天' };
        parts.push(dayLabels[reviewDays] || `近 ${reviewDays} 天`);
      }
      if (useCount) {
        const cap = dataset && dataset.max_reviews_per_app
          ? dataset.max_reviews_per_app
          : parseInt(document.getElementById('max-reviews')?.value || '0', 10);
        if (cap) parts.push(`每产品最多 ${cap} 条`);
      }
      return parts.join(' + ') || '未设置筛选条件';
    }

    function buildCrawlFilterParams() {
      const useDays = document.getElementById('use-review-days')?.checked;
      const useCount = document.getElementById('use-max-reviews')?.checked;
      if (!useDays && !useCount) {
        return { error: '请至少勾选「按时间范围筛选」或「限制评价数量」之一' };
      }
      const params = new URLSearchParams();
      params.set('use_review_days', useDays ? 'true' : 'false');
      if (useDays) {
        const reviewDays = parseInt(document.getElementById('review-days')?.value || '30', 10) || 30;
        params.set('review_days', String(reviewDays));
      }
      params.set('use_max_reviews', useCount ? 'true' : 'false');
      if (useCount) {
        const maxReviews = parseInt(document.getElementById('max-reviews')?.value || '0', 10);
        if (!maxReviews || maxReviews < 1) {
          return { error: '启用评价数量时请填写大于 0 的条数' };
        }
        params.set('max_reviews', String(maxReviews));
      }
      params.set('market_country', selectedMarketCountry());
      const marketLabel = describeMarket();
      const filterLabel = describeCrawlFilters({
        use_review_days: useDays,
        review_days: useDays ? (parseInt(document.getElementById('review-days')?.value || '30', 10) || 30) : null,
        use_max_reviews: useCount,
        max_reviews_per_app: useCount ? parseInt(document.getElementById('max-reviews')?.value || '0', 10) : null,
      });
      const label = marketLabel ? `${marketLabel} · ${filterLabel}` : filterLabel;
      return { params, label };
    }

    function filterPayload(payload) {
      const ids = new Set(selectedProductIds());
      if (!ids.size) return payload;
      const analysis = payload.analysis || {};
      const reports = (analysis.product_reports || []).filter((r) =>
        ids.has(String(r.product || ''))
      );
      const totalComments = reports.reduce((sum, row) => sum + Number(row.sample_size || 0), 0);
      const totalPositive = reports.reduce((sum, row) => sum + Number(row.positive_reviews || 0), 0);
      const overallRate = totalComments
        ? Math.round((totalPositive / totalComments) * 10000) / 100
        : 0;
      const filteredAnalysis = Object.assign({}, analysis, {
        product_reports: reports,
        summary: Object.assign({}, analysis.summary || {}, {
          total_products: reports.length,
          total_comments: totalComments,
          overall_positive_rate: overallRate,
        }),
      });
      if (analysis.ai_strategy && analysis.ai_strategy.peer_comparison) {
        filteredAnalysis.ai_strategy = Object.assign({}, analysis.ai_strategy, {
          peer_comparison: (analysis.ai_strategy.peer_comparison || []).filter((p) =>
            ids.has(String(p.product || p.product_id || ''))
          ),
        });
      }
      return Object.assign({}, payload, { analysis: filteredAnalysis });
    }

    function render(payload) {
      lastPayload = payload;
      payload = filterPayload(payload);
      const analysis = payload.analysis || {};
      const validation = payload.validation || {};
      const summary = analysis.summary || {};
      const strategy = analysis.ai_strategy || {};
      const reports = analysis.product_reports || [];
      const checks = validation.checks || [];
      const ids = selectedProductIds();
      const ch = selectedChannel();
      statusEl.textContent =
        `最新结果：${summary.generated_at || validation.checked_at || '未知'} · 已选 ${ids.length} 款产品 · 渠道 ${ch}`;

      if (!reports.length) {
        contentEl.innerHTML = '<div class="empty">还没有可展示的 MVP 分析结果，请点击“重新抓取”。</div>';
        return;
      }

      const gameHtml = reports.map((report) => {
        const themes = (report.top_negative_themes || []).map((item) =>
          `<li>${escapeHtml(item.theme)}：${escapeHtml(item.count)}</li>`
        ).join('') || '<li>未在样本中识别到高频负面主题</li>';
        const negatives = (report.representative_negative_reviews || []).map((text) =>
          `<li>${escapeHtml(text)}</li>`
        ).join('') || '<li>暂无负面样本</li>';
        const riskClass = report.risk_level === 'low' ? '' : 'warn';
        return `
          <article class="game">
            <div class="game-head">
              <div>
                <h2>${escapeHtml(report.product_name)}</h2>
                <div class="label">产品 ID：${escapeHtml(report.product)} · ${escapeHtml(ch)}</div>
              </div>
              <span class="badge ${riskClass}">风险：${escapeHtml(report.risk_level)}</span>
            </div>
            <div class="split">
              <div class="mini"><span class="label">样本数</span><strong>${escapeHtml(report.sample_size)}</strong></div>
              <div class="mini"><span class="label">好评</span><strong>${escapeHtml(report.positive_reviews)}</strong></div>
              <div class="mini"><span class="label">差评</span><strong>${escapeHtml(report.negative_reviews)}</strong></div>
            </div>
            <p><strong>样本好评率：</strong>${escapeHtml(report.positive_rate)}%</p>
            <p><strong>建议：</strong>${escapeHtml(report.recommendation)}</p>
            <div class="split">
              <div>
                <div class="label">负面主题</div>
                <ul>${themes}</ul>
              </div>
              <div style="grid-column: span 2;">
                <div class="label">代表性负面评论</div>
                <ul>${negatives}</ul>
              </div>
            </div>
          </article>
        `;
      }).join('');

      const checkHtml = checks.map((check) => `
        <div class="check">
          <span class="dot"></span>
          <div>
            <strong>${escapeHtml(check.name)}</strong><br>
            <span class="label">${escapeHtml(check.detail)}</span>
          </div>
        </div>
      `).join('');

      const peerHtml = (strategy.peer_comparison || []).map((item) => `
        <div class="strategy-item">
          <h3>${escapeHtml(item.product_name)}</h3>
          <div class="label">${escapeHtml(item.relative_position)} · Steam 汇总好评率 ${escapeHtml(item.steam_total_positive_rate)}%</div>
          <p>${escapeHtml(item.what_to_learn)}</p>
          <div class="label">中位总游玩：${escapeHtml(item.median_playtime_hours)} 小时 · 汇总评论：${escapeHtml(item.steam_total_reviews)}</div>
        </div>
      `).join('');

      const needsHtml = (strategy.user_needs || []).slice(0, 6).map((item) => `
        <div class="strategy-item">
          <h3>${escapeHtml(item.need)}</h3>
          <div class="label">评论信号：${escapeHtml(item.signal_count)}</div>
          <p>${escapeHtml(item.product_action)}</p>
          <ul>${(item.evidence || []).slice(0, 2).map((text) => `<li>${escapeHtml(text)}</li>`).join('')}</ul>
        </div>
      `).join('');

      const actionHtml = (strategy.prioritized_actions || []).map((item) => `
        <div class="strategy-item">
          <h3>${escapeHtml(item.priority)}. ${escapeHtml(item.title)}</h3>
          <p>${escapeHtml(item.why)}</p>
          <p><strong>改进：</strong>${escapeHtml(item.action)}</p>
          <p><strong>验证：</strong>${escapeHtml(item.experiment)}</p>
        </div>
      `).join('');

      const segmentHtml = (strategy.target_user_segments || []).map((item) => `
        <li>${escapeHtml(item.segment)}：${escapeHtml(item.sample_count)} 条样本，核心需求：${escapeHtml(item.primary_need)}</li>
      `).join('');

      const strategyHtml = `
        <section class="panel" style="margin-bottom: 18px;">
          <h2>AI 产品改进分析</h2>
          <p>${escapeHtml(strategy.opportunity_summary || '正在等待真实数据生成产品策略。')}</p>
          <p class="label">模式：${escapeHtml(strategy.mode || 'local_ai_grounded_in_steam_data')}。分析基于真实 Steam 评论、评论汇总指标和同类产品对比生成。</p>
          <h2>同类产品结果对比</h2>
          <div class="strategy-grid">${peerHtml || '<div class="empty">暂无同类产品对比。</div>'}</div>
          <h2>面向用户的需求</h2>
          <div class="strategy-grid">${needsHtml || '<div class="empty">暂无可识别需求，请扩大评论样本。</div>'}</div>
          <h2>优先改进路线</h2>
          <div class="strategy-grid">${actionHtml || '<div class="empty">暂无建议。</div>'}</div>
          <h2>目标用户段</h2>
          <ul>${segmentHtml || '<li>暂无用户段数据。</li>'}</ul>
        </section>
      `;

      const filterDesc = describeCrawlFilters(payload.dataset || {});
      const marketDesc = describeMarket(payload.dataset || {});
      const scopeDesc = marketDesc ? `${marketDesc} · ${filterDesc}` : filterDesc;
      const perProductHtml = reports.map((report) =>
        `<li>${escapeHtml(report.product_name)}：${escapeHtml(report.sample_size)} 条（${escapeHtml(scopeDesc)}）</li>`
      ).join('');

      contentEl.innerHTML = `
        <section class="metrics">
          <div class="metric"><div class="label">产品数</div><div class="value">${escapeHtml(summary.total_products)}</div></div>
          <div class="metric"><div class="label">真实评论样本</div><div class="value">${escapeHtml(summary.total_comments)}</div></div>
          <div class="metric"><div class="label">整体好评率</div><div class="value">${escapeHtml(summary.overall_positive_rate)}%</div></div>
          <div class="metric"><div class="label">验证状态</div><div class="value">${validation.passed ? '通过' : '失败'}</div></div>
        </section>
        <p class="filter-hint" style="margin:0 0 14px;">各产品样本（${escapeHtml(scopeDesc)}）：<ul style="margin:6px 0 0 18px;">${perProductHtml}</ul>国家决定渠道区服；只勾时间 = 该时段内全部评论；只勾条数 = 最新 N 条。</p>
        ${strategyHtml}
        <section class="grid">
          <div class="games">${gameHtml}</div>
          <aside class="panel">
            <h2>验证结果</h2>
            <div class="checks">${checkHtml}</div>
            <p class="label">验证会从源评论重算样本量、正负评论数和好评率，确认分析结果没有脱离爬取数据。</p>
          </aside>
        </section>
      `;
    }

    function productsForChannel(channel) {
      const ch = channel || selectedChannel();
      if (ch === 'steam') {
        return catalogProducts.filter((p) => !p.platform || p.platform === 'steam');
      }
      const scoped = catalogProducts.filter((p) => p.platform === ch);
      return scoped;
    }

    function channelHint(channel) {
      const sync = '抓取成功后数据自动写入看板数据集，请前往 /dashboard 点「应用筛选」查看。';
      const hints = {
        steam: 'Steam 渠道仅显示 PC 游戏。Last War / Dark War / Last Beacon 等手游请切换到 Google Play 或 TapTap。' + sync,
        taptap: 'TapTap 渠道可选 Last War、原神、王者荣耀等；Dark War / Last Beacon 请用 Google Play。' + sync,
        google_play: 'Google Play 渠道可选 Last War、Dark War、Last Beacon、原神等手游。' + sync,
        app_store: 'App Store 暂不支持抓取，仅可筛选已有结果。',
      };
      return hints[channel] || hints.steam;
    }

    function channelProductHint(channel) {
      const ch = channel || selectedChannel();
      const count = productsForChannel(ch).length;
      if (ch === 'google_play') {
        return count
          ? `当前渠道 ${count} 款手游可选（含 Last War、Dark War、Last Beacon）。`
          : '当前渠道暂无产品，请用下方「新增游戏产品」添加。';
      }
      if (ch === 'taptap') {
        return count
          ? `当前渠道 ${count} 款 TapTap 游戏可选（含 Last War）。`
          : '当前渠道暂无产品。';
      }
      if (ch === 'steam') {
        return count
          ? `当前渠道 ${count} 款 Steam 游戏可选；手游不在此列表。`
          : '当前渠道暂无产品。';
      }
      return '';
    }

    function renderProductPicker(channel) {
      const ch = channel || selectedChannel();
      const products = productsForChannel(ch);
      const defaults = defaultByChannel[ch] || dataDefaultIds(ch);
      const hintEl = document.getElementById('channel-product-hint');
      if (hintEl) hintEl.textContent = channelProductHint(ch);
      if (window.ProductPicker) {
        ProductPicker.render('product-picker', products, {
          selectedIds: defaults.filter((id) => products.some((p) => p.id === id)),
          defaultCount: Math.min(3, products.length),
          emptyHint:
            ch === 'google_play'
              ? '请切换到 Google Play 渠道，或用下方「新增游戏产品」添加包名'
              : ch === 'taptap'
                ? '请切换到 TapTap 渠道，或用下方「新增游戏产品」添加 AppID'
                : '暂无产品 — 请切换渠道或新增游戏产品',
          onChange: () => {
            if (lastPayload) render(lastPayload);
          },
        });
      }
    }

    function dataDefaultIds(channel) {
      if (channel === 'taptap') return ['33569155'];
      if (channel === 'google_play') {
        return ['com.fun.lastwar.gp', 'com.readygo.dark.gp', 'com.hnhs.endlesssea.gp'];
      }
      return [];
    }

    async function loadCatalog(selectIds) {
      const res = await fetch('/api/mvp/catalog');
      if (!res.ok) throw new Error('无法加载产品列表');
      const data = await res.json();
      catalogProducts = data.products || [];
      defaultByChannel = data.default_by_channel || {};
      marketsByChannel = data.markets_by_channel || {};
      defaultMarketByChannel = data.default_market_by_channel || {};
      const pickIds = selectIds && selectIds.length ? selectIds : null;
      channelSelect.innerHTML = (data.channels || [{ id: 'steam', label: 'Steam' }])
        .map((c) => {
          const disabled = c.crawl_supported ? '' : ' disabled';
          return `<option value="${escapeHtml(c.id)}"${disabled}>${escapeHtml(c.label)}</option>`;
        })
        .join('');
      if (pickIds && window.ProductPicker) {
        ProductPicker.render('product-picker', productsForChannel(selectedChannel()), {
          selectedIds: pickIds,
          defaultCount: pickIds.length,
          onChange: () => { if (lastPayload) render(lastPayload); },
        });
      } else {
        renderProductPicker(selectedChannel());
      }
      renderMarketSelect(selectedChannel());
      filterHintEl.textContent = channelHint(selectedChannel());
    }

    async function addNewProduct() {
      const name = (document.getElementById('new-product-name')?.value || '').trim();
      const productId = (document.getElementById('new-product-id')?.value || '').trim();
      const platform = selectedChannel();
      if (!name) {
        statusEl.textContent = '请填写要新增的游戏产品名称';
        return;
      }
      const addBtn = document.getElementById('add-product');
      if (addBtn) addBtn.disabled = true;
      statusEl.textContent = `正在添加游戏产品「${name}」…`;
      try {
        const res = await fetch('/api/mvp/custom-products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, platform, product_id: productId }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || '添加失败');
        const product = data.product || {};
        document.getElementById('new-product-name').value = '';
        document.getElementById('new-product-id').value = '';
        await loadCatalog([String(product.id || '')].filter(Boolean));
        statusEl.textContent = `已添加「${product.name || name}」到产品列表，请点「重新抓取」拉取数据。`;
      } catch (error) {
        statusEl.textContent = `添加失败：${error.message}`;
      } finally {
        if (addBtn) addBtn.disabled = false;
      }
    }

    async function loadLatest() {
      const channel = selectedChannel();
      const auth = mvpAuthQuery();
      const response = await fetch(
        '/api/mvp/latest?channel=' + encodeURIComponent(channel) + (auth ? '&' + auth : '')
      );
      if (!response.ok) throw new Error(await response.text());
      render(await response.json());
    }

    async function refreshData() {
      const channel = selectedChannel();
      const crawlRoutes = {
        steam: '/api/mvp/steam',
        taptap: '/api/mvp/taptap',
        google_play: '/api/mvp/google-play',
      };
      const route = crawlRoutes[channel];
      if (!route) {
        statusEl.textContent = channel === 'app_store'
          ? 'App Store 评论抓取即将支持；请先用 Google Play 或 TapTap 抓取 iOS 手游口碑。'
          : '当前渠道暂不支持重新抓取，请切换 Steam / TapTap / Google Play。';
        return;
      }
      const ids = selectedProductIds();
      if (!ids.length) {
        statusEl.textContent = '请至少选择一款产品，或先用「新增游戏产品」添加游戏';
        return;
      }
      const labels = { steam: 'Steam', taptap: 'TapTap', google_play: 'Google Play' };
      const filterBuild = buildCrawlFilterParams();
      if (filterBuild.error) {
        statusEl.textContent = filterBuild.error;
        return;
      }
      refreshButton.disabled = true;
      const progressWrap = document.getElementById('crawl-progress-wrap');
      const progressBar = document.getElementById('crawl-progress-bar');
      const progressLabel = document.getElementById('crawl-progress-label');
      const progressPercent = document.getElementById('crawl-progress-percent');
      if (progressWrap) progressWrap.style.display = 'block';
      const token = mvpAuthToken();
      let lastPayload = null;
      let totalReviews = 0;
      try {
        for (let index = 0; index < ids.length; index++) {
          const appId = ids[index];
          const pct = Math.round((index / ids.length) * 100);
          if (progressBar) progressBar.style.width = pct + '%';
          if (progressPercent) progressPercent.textContent = pct + '%';
          if (progressLabel) {
            progressLabel.textContent = `正在抓取 ${index + 1}/${ids.length}：${appId}`;
          }
          statusEl.textContent =
            `正在从 ${labels[channel] || channel} 抓取 ${index + 1}/${ids.length}（${filterBuild.label}）…`;
          const params = new URLSearchParams(filterBuild.params);
          params.set('app_ids', appId);
          if (token) params.set('token', token);
          const response = await fetch(route + '?' + params.toString(), {
            headers: mvpAuthHeaders(),
          });
          if (!response.ok) throw new Error(await response.text());
          lastPayload = await response.json();
          const count = lastPayload.review_counts
            ? Object.values(lastPayload.review_counts).reduce((a, b) => a + Number(b || 0), 0)
            : 0;
          totalReviews += count;
        }
        if (progressBar) progressBar.style.width = '100%';
        if (progressPercent) progressPercent.textContent = '100%';
        const mode = lastPayload?.data_mode === 'live' ? '真实数据' : '演示回退';
        const dashParams = new URLSearchParams();
        const crawledIds = (lastPayload?.crawled_app_ids || ids).join(',');
        if (crawledIds) dashParams.set('product_ids', crawledIds);
        if (channel && channel !== 'steam') dashParams.set('data_source', channel);
        statusEl.innerHTML =
          `${labels[channel]} 抓取完成（${ids.length} 款产品 · ${mode}${totalReviews ? ` · 合计约 ${totalReviews} 条评论` : ''}）· 数据已写入看板，` +
          `<a href="/dashboard?${dashParams.toString()}" style="color:var(--accent);margin-left:6px;">前往看板查看 →</a>`;
        await loadLatest();
      } catch (error) {
        statusEl.textContent = `刷新失败：${error.message}`;
      } finally {
        refreshButton.disabled = false;
        setTimeout(() => {
          if (progressWrap) progressWrap.style.display = 'none';
          if (progressBar) progressBar.style.width = '0%';
        }, 1200);
      }
    }

    document.getElementById('apply-filter').addEventListener('click', () => {
      if (lastPayload) render(lastPayload);
      else loadLatest().catch((e) => { statusEl.textContent = e.message; });
    });
    channelSelect.addEventListener('change', () => {
      const ch = selectedChannel();
      filterHintEl.textContent = channelHint(ch);
      renderMarketSelect(ch);
      renderProductPicker(ch);
      if (lastPayload) render(lastPayload);
    });
    refreshButton.addEventListener('click', refreshData);
    document.getElementById('add-product')?.addEventListener('click', addNewProduct);
    document.getElementById('use-review-days')?.addEventListener('change', syncCrawlFilterControls);
    document.getElementById('use-max-reviews')?.addEventListener('change', syncCrawlFilterControls);
    syncCrawlFilterControls();

    (async function init() {
      if (window.AppNav) AppNav.mount('#app-nav-mount');
      if (window.DataFlowGuide) {
        DataFlowGuide.renderAdvancedNotice('mvp-advanced-notice', { theme: 'light', focus: 'mvp' });
      }
      if (!mvpAuthToken()) {
        location.replace('/login?redirect=' + encodeURIComponent('/mvp'));
        return;
      }
      try {
        await loadCatalog();
        await loadLatest();
      } catch (error) {
        statusEl.textContent = `读取失败：${error.message}`;
        contentEl.innerHTML = '<div class="empty">还没有结果。选择产品后点击「重新抓取」。</div>';
      }
    })();
  </script>
</body>
</html>
