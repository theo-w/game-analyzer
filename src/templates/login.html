<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏数据分析引擎 - 登录</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f5f7 0%, #eef1f5 50%, #e8edf3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        .logo-title {
            font-size: 24px;
            font-weight: 600;
            color: #1d1d1f;
            letter-spacing: -0.5px;
        }
        
        .logo-subtitle {
            font-size: 14px;
            color: #6e6e73;
            margin-top: 4px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #515154;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            background: #ffffff;
            color: #1d1d1f;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }
        
        .form-input:focus {
            border-color: #0071e3;
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.2);
            background: #ffffff;
        }
        
        .form-input::placeholder {
            color: #aeaeb2;
        }
        
        .password-input-wrapper {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #6e6e73;
            transition: color 0.3s ease;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .password-toggle:hover {
            color: #1d1d1f;
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0071e3 0%, #0051a2 100%);
            border: none;
            border-radius: 12px;
            color: #1d1d1f;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 113, 227, 0.35);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 12px 14px;
            color: #ef4444;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }

        .info-message {
            background: rgba(234, 179, 8, 0.12);
            border: 1px solid rgba(234, 179, 8, 0.35);
            border-radius: 8px;
            padding: 12px 14px;
            color: #92400e;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .info-message.show {
            display: block;
        }

        .demo-login-btn {
            width: 100%;
            margin-top: 10px;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(0, 113, 227, 0.45);
            background: rgba(0, 113, 227, 0.08);
            color: #0071e3;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .demo-login-btn:hover {
            background: rgba(0, 113, 227, 0.16);
        }
        
        .register-link {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }
        
        .register-link a {
            color: #0071e3;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .register-link a:hover {
            color: #0051a2;
        }
        
        .demo-info {
            background: rgba(0, 113, 227, 0.06);
            border: 1px solid rgba(0, 113, 227, 0.2);
            border-radius: 8px;
            padding: 12px 14px;
            margin-top: 16px;
        }
        
        .demo-info-title {
            font-size: 12px;
            color: #6e6e73;
            margin-bottom: 4px;
        }
        
        .demo-info-text {
            font-size: 13px;
            color: #1d1d1f;
            font-family: 'Monaco', 'Consolas', monospace;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal-content {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 20px;
        }
        
        .modal-close {
            float: right;
            background: none;
            border: none;
            color: #6e6e73;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .modal-close:hover {
            color: #1d1d1f;
        }
        
        .register-btn {
            width: 100%;
            padding: 12px;
            background: rgba(0, 113, 227, 0.08);
            border: 1px solid #0071e3;
            border-radius: 10px;
            color: #0071e3;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }
        
        .register-btn:hover {
            background: #0071e3;
            color: #1d1d1f;
        }
        
        .success-message {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 8px;
            padding: 12px 14px;
            color: #16a34a;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">🎮</div>
            <div class="logo-title">Game Analytics</div>
            <div class="logo-subtitle">游戏数据分析引擎</div>
        </div>
        
        <div class="info-message" id="info-message"></div>
        <div class="error-message" id="error-message">用户名或密码错误</div>
        <div class="success-message" id="success-message">注册成功，请登录</div>
        
        <form id="login-form">
            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" class="form-input" id="username" placeholder="请输入用户名" required>
            </div>
            
            <div class="form-group password-group">
                <label class="form-label">密码</label>
                <div class="password-input-wrapper">
                    <input type="password" class="form-input" id="password" placeholder="请输入密码" required>
                    <button type="button" class="password-toggle" id="password-toggle" onclick="togglePassword('password')">👁️</button>
                </div>
            </div>
            
            <button type="submit" class="login-btn" id="login-submit-btn">登录</button>
            <button type="button" class="demo-login-btn" id="btn-demo-login">⚡ Demo 登录（demo / demo123）</button>
            <button type="button" class="demo-login-btn" id="btn-admin-login" style="margin-top:6px;">🔑 管理员登录（admin / admin123）</button>
        </form>
        
        <div class="demo-info">
            <div class="demo-info-title">演示账号</div>
            <div class="demo-info-text">
                管理员 <strong>admin</strong> / admin123 · 演示用户 demo / demo123<br>
                人工坐席 <strong>agent1</strong> 或 agent2 / agent123（登录后进入客服工作台）
            </div>
        </div>
        
        <div class="register-link">
            <a href="/forgot-password">忘记密码？</a>
        </div>
        <div class="register-link">
            还没有账号？ <a href="#" id="register-link">立即注册</a>
        </div>
    </div>
    
    <div class="modal-overlay" id="register-modal">
        <div class="modal-content">
            <button class="modal-close" id="close-modal">&times;</button>
            <div class="modal-title">注册新账号</div>
            
            <form id="register-form">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-input" id="reg-username" placeholder="请输入用户名" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">邮箱</label>
                    <input type="email" class="form-input" id="reg-email" placeholder="请输入邮箱" required>
                </div>
                
                <div class="form-group password-group">
                    <label class="form-label">密码</label>
                    <div class="password-input-wrapper">
                        <input type="password" class="form-input" id="reg-password" placeholder="请输入密码" required>
                        <button type="button" class="password-toggle" id="reg-password-toggle" onclick="togglePassword('reg-password')">👁️</button>
                    </div>
                </div>
                
                <button type="submit" class="register-btn">注册</button>
            </form>
        </div>
    </div>
    
    <script src="/static/js/device-id.js"></script>
    <script src="/static/js/auth-token.js"></script>
    <script src="/static/js/auth-nav.js"></script>
    <script>
        function hideMessages() {
            document.getElementById('error-message').classList.remove('show');
            document.getElementById('info-message').classList.remove('show');
        }

        function showError(msg) {
            const el = document.getElementById('error-message');
            el.textContent = msg;
            el.classList.add('show');
            document.getElementById('info-message').classList.remove('show');
        }

        function connectionErrorMessage() {
            const host = window.location.hostname;
            const isLocal = host === '127.0.0.1' || host === 'localhost';
            if (isLocal) {
                return '无法连接服务器，请确认已在项目目录运行 ./scripts/dev.sh 并访问 http://127.0.0.1:8080/login';
            }
            if (host.endsWith('.onrender.com')) {
                return '无法连接服务器：Render 服务可能已暂停或正在冷启动。请到 Render Dashboard 恢复服务并等待 1–2 分钟后再试。';
            }
            return '无法连接服务器，请稍后重试或联系管理员。';
        }

        async function login(event) {
            if (event) event.preventDefault();
            hideMessages();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('login-submit-btn');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = '登录中…';
            }

            try {
                const response = await fetch('/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        'username': username,
                        'password': password,
                        'grant_type': 'password'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    try {
                        setAuthToken(data.access_token);
                        sessionStorage.setItem('token_type', data.token_type);
                        setAuthUser(username);
                    } catch (storageErr) {
                        console.error('无法保存登录状态', storageErr);
                        document.getElementById('error-message').textContent = '浏览器无法保存登录状态，请关闭隐私模式或换用 Chrome';
                        document.getElementById('error-message').classList.add('show');
                        return;
                    }
                    let redirect = new URLSearchParams(window.location.search).get('redirect');
                    let role = 'user';
                    try {
                        const fetchFn = typeof authFetch === 'function' ? authFetch : fetch;
                        const meRes = await fetchFn('/api/user');
                        if (meRes.ok) {
                            const me = await meRes.json();
                            role = me.role || 'user';
                            setAuthUser(username, role, me.full_name);
                        }
                    } catch (_) { /* ignore */ }
                    if (role === 'agent' || /^agent\d*$/i.test(username)) {
                        redirect = '/agent/console';
                    }
                    const target = redirect || '/';
                    window.location.replace(target);
                    return;
                } else {
                    let msg = '用户名或密码错误';
                    try {
                        const err = await response.json();
                        if (err.detail) msg = typeof err.detail === 'string' ? err.detail : JSON.stringify(err.detail);
                    } catch (_) { /* ignore */ }
                    showError(msg);
                    document.getElementById('success-message').classList.remove('show');
                }
            } catch (error) {
                showError(connectionErrorMessage());
                console.error('Login failed', error);
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '登录';
                }
            }
        }
        
        async function register(event) {
            event.preventDefault();
            
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            
            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        'username': username,
                        'email': email,
                        'password': password
                    })
                });
                
                if (response.ok) {
                    document.getElementById('register-modal').classList.remove('show');
                    document.getElementById('success-message').classList.add('show');
                    document.getElementById('error-message').classList.remove('show');
                } else {
                    const data = await response.json();
                    document.getElementById('error-message').textContent = data.detail || '注册失败';
                    document.getElementById('error-message').classList.add('show');
                }
            } catch (error) {
                document.getElementById('error-message').textContent = '注册失败';
                document.getElementById('error-message').classList.add('show');
            }
        }
        
        document.getElementById('login-form').addEventListener('submit', login);
        document.getElementById('register-form').addEventListener('submit', register);
        
        document.getElementById('register-link').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('register-modal').classList.add('show');
        });
        
        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('register-modal').classList.remove('show');
        });
        
        document.getElementById('register-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('register-modal')) {
                document.getElementById('register-modal').classList.remove('show');
            }
        });
        
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const toggle = document.getElementById(inputId + '-toggle');
            if (input.type === 'password') {
                input.type = 'text';
                toggle.textContent = '🙈';
            } else {
                input.type = 'password';
                toggle.textContent = '👁️';
            }
        }

        function quickLogin(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            login();
        }
        document.getElementById('btn-demo-login').addEventListener('click', () => quickLogin('demo', 'demo123'));
        document.getElementById('btn-admin-login').addEventListener('click', () => quickLogin('admin', 'admin123'));

        (async function autoRedirectIfLoggedIn() {
            const params = new URLSearchParams(location.search);
            if (params.get('reason') === 'expired') {
                const info = document.getElementById('info-message');
                info.textContent = '上次登录已过期或被清除，请重新登录。演示：demo / demo123 · 管理员：admin / admin123';
                info.classList.add('show');
                document.getElementById('error-message').classList.remove('show');
            }
            if (typeof AuthNav === 'undefined') return;
            const token = typeof getAuthToken === 'function' ? getAuthToken() : '';
            if (token && (await AuthNav.validateToken(token))) {
                const redirect = params.get('redirect') || '/';
                window.location.replace(redirect);
            }
        })();
    </script>
</body>
</html>
