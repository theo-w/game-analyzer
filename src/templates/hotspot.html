<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行业热点文章存档</title>
    <link rel="stylesheet" href="/static/css/analysis-guide.css">
    <script src="/static/js/auth-token.js"></script>
    <script src="/static/js/app-nav.js" defer></script>
    <script src="/static/js/markdown-preview.js"></script>
    <style>
        :root {
            --bg: #0f1419; --panel: #1a2332; --text: #e7ecf3; --muted: #94a3b8;
            --accent: #f59e0b; --border: rgba(255,255,255,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .page { max-width: 1100px; margin: 0 auto; padding: 20px 24px 48px; }
        .hero { margin: 16px 0 20px; }
        .hero h1 { font-size: 1.45rem; margin-bottom: 8px; }
        .hero p { color: var(--muted); line-height: 1.6; font-size: 0.92rem; }
        .archive-notice {
            border: 1px solid rgba(245,158,11,0.35); border-radius: 14px;
            background: rgba(245,158,11,0.07); padding: 16px 18px; margin-bottom: 20px;
            font-size: 0.86rem; line-height: 1.75;
        }
        .archive-notice strong { color: #fcd34d; }
        .archive-notice p { margin-bottom: 6px; }
        .archive-notice p:last-child { margin-bottom: 0; }
        .grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
        .panel h2 { font-size: 1rem; margin-bottom: 12px; }
        .article-list { display: flex; flex-direction: column; gap: 10px; max-height: 70vh; overflow-y: auto; }
        .article-card {
            border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .article-card:hover { border-color: rgba(245,158,11,0.45); }
        .article-card.active { border-color: var(--accent); background: rgba(245,158,11,0.1); }
        .article-card h3 { font-size: 0.88rem; line-height: 1.45; margin-bottom: 6px; }
        .article-meta { font-size: 0.75rem; color: var(--muted); }
        .status { font-size: 0.82rem; color: var(--muted); min-height: 1.2em; }
        .article-shell { min-height: 360px; }
        .article-shell .md-preview { line-height: 1.7; font-size: 0.95rem; }
        .article-shell .md-preview h2 { margin: 1.2em 0 0.5em; font-size: 1.15rem; color: #fcd34d; }
        .article-shell .md-preview h3 { margin: 1em 0 0.4em; font-size: 1rem; }
        .article-shell .md-preview blockquote.lead { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--muted); margin-bottom: 1em; }
        .article-source { font-size: 0.78rem; color: var(--muted); margin-bottom: 12px; }
        .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
    </style>
</head>
<body>
    <div id="app-nav-mount"></div>
    <div class="page">
        <div class="hero">
            <h1>📚 行业热点文章存档</h1>
            <p>此前由 AI 流水线生成的行业热点深度文章，现转为静态存档供查阅。</p>
        </div>
        <div class="archive-notice">
            <p><strong>内容溯源</strong>：以下文章由本平台 AI 流水线（评论样本统计 + LLM）于 2026-09-19 之前生成；
                数据来源为平台内抓取/导入的玩家评论样本与 Steam 公开新闻，样本量有限，结论不代表全网统计。
                每篇文末保留生成时间与生成引擎标注。</p>
            <p><strong>降级说明</strong>：依上线前预设的处置阈值（30 天自然访问 &lt;10 且搜索展示 &lt;100；
                2026-09-19 依实际数据确认触发），本功能停止生成新文章，已有文章转为静态存档。</p>
        </div>
        <div class="grid">
            <aside class="panel">
                <h2>存档列表</h2>
                <div class="status" id="list-status">加载中…</div>
                <div class="article-list" id="article-list"></div>
            </aside>
            <main class="panel">
                <div class="article-shell" id="article-view">
                    <div class="empty">← 选择左侧文章查看全文</div>
                </div>
            </main>
        </div>
    </div>
    <script>
        (function () {
            var allArticles = [];
            var token = window.getAuthToken && window.getAuthToken();

            function esc(s) {
                var d = document.createElement("div");
                d.textContent = s == null ? "" : String(s);
                return d.innerHTML;
            }

            function authFetch(url) {
                var sep = url.indexOf("?") >= 0 ? "&" : "?";
                var opts = { headers: {} };
                if (token) opts.headers.Authorization = "Bearer " + token;
                return fetch(url + sep + "token=" + encodeURIComponent(token || ""), opts);
            }

            function formatDate(iso) {
                return (iso || "").slice(0, 10);
            }

            function renderList(articles, total) {
                allArticles = articles || [];
                var list = document.getElementById("article-list");
                var status = document.getElementById("list-status");
                if (!allArticles.length) {
                    status.textContent = "";
                    list.innerHTML = '<div class="empty">暂无存档文章。</div>';
                    return;
                }
                var count = (total != null) ? total : allArticles.length;
                status.textContent = count > allArticles.length
                    ? "共 " + count + " 篇存档（仅显示最新 " + allArticles.length + " 篇）"
                    : "共 " + count + " 篇存档";
                list.innerHTML = allArticles.map(function (a, i) {
                    var facts = (a.snapshot_json && a.snapshot_json.facts) || {};
                    var meta = [];
                    if (facts.product_name) meta.push("《" + facts.product_name + "》");
                    if (facts.sample_size != null) meta.push("样本 " + facts.sample_size + " 条");
                    if (facts.data_basis) meta.push("数据来源 " + facts.data_basis);
                    meta.push(formatDate(a.created_at));
                    return (
                        '<div class="article-card" data-idx="' + i + '">' +
                        "<h3>" + esc(a.title) + "</h3>" +
                        '<div class="article-meta">' + esc(meta.filter(Boolean).join(" · ")) + "</div>" +
                        "</div>"
                    );
                }).join("");
                list.querySelectorAll(".article-card").forEach(function (el) {
                    el.addEventListener("click", function () {
                        list.querySelectorAll(".article-card").forEach(function (c) { c.classList.remove("active"); });
                        el.classList.add("active");
                        renderArticle(allArticles[Number(el.getAttribute("data-idx"))]);
                    });
                });
            }

            function renderArticle(article) {
                var view = document.getElementById("article-view");
                var facts = (article.snapshot_json && article.snapshot_json.facts) || {};
                var sourceBits = [];
                if (facts.product_name) sourceBits.push("产品：" + facts.product_name);
                if (facts.sample_size != null) sourceBits.push("评论样本：" + facts.sample_size + " 条");
                if (facts.data_basis) sourceBits.push("数据来源：" + facts.data_basis);
                sourceBits.push("生成时间：" + formatDate(article.created_at));
                sourceBits.push("静态存档 · 非实时数据");
                var body = (window.MarkdownPreview && window.MarkdownPreview.render(article.body_markdown))
                    || "<pre style=\"white-space:pre-wrap;\">" + esc(article.body_markdown) + "</pre>";
                view.innerHTML =
                    '<h2 style="margin-bottom:10px;font-size:1.1rem;">' + esc(article.title) + "</h2>" +
                    '<div class="article-source">' + esc(sourceBits.join(" · ")) + "</div>" + body;
            }

            async function loadArchive() {
                var status = document.getElementById("list-status");
                try {
                    var res = await authFetch("/api/hotspot/archive");
                    if (res.status === 401) {
                        location.href = "/login?redirect=" + encodeURIComponent("/hotspot");
                        return;
                    }
                    var data = await res.json();
                    if (!data.success) throw new Error(data.detail || data.message || "加载失败");
                    renderList(data.articles || [], data.total);
                } catch (e) {
                    status.textContent = "加载失败：" + (e.message || e);
                }
            }

            if (window.AppNav) {
                document.getElementById("app-nav-mount").innerHTML = window.AppNav.render("hotspot");
                window.AppNav.bind();
            }
            if (!token) {
                location.href = "/login?redirect=" + encodeURIComponent("/hotspot");
                return;
            }
            loadArchive();
        })();
    </script>
</body>
</html>
