<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分享报告</title>
    <link rel="stylesheet" href="/static/css/scenario-workspace.css">
    <script src="/static/js/data-provenance.js"></script>
    <script src="/static/js/markdown-preview.js"></script>
    <script src="/static/js/scenario-report.js"></script>
    <style>
        body { font-family:-apple-system,BlinkMacSystemFont,sans-serif; background:#0f1419; color:#e7ecf3; margin:0; padding:24px; }
        .wrap { max-width:880px; margin:0 auto; }
        .banner { padding:12px 16px; background:rgba(6,182,212,0.12); border-left:4px solid #06b6d4; border-radius:0 8px 8px 0; margin-bottom:20px; font-size:0.85rem; color:#94a3b8; }
        .error { color:#f87171; text-align:center; padding:48px; }
        .meta { font-size:0.8rem; color:#64748b; margin-bottom:16px; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="banner" id="share-banner">📎 分享报告 · 公开评论样本分析 · 仅供参考</div>
        <div class="meta" id="share-meta"></div>
        <div id="content"><p class="error">加载中…</p></div>
    </div>
    <script>
        const token = location.pathname.split('/').pop();
        const SOURCE_HINT = {
            mvp_steam: 'Steam 公开评论样本',
            taptap_public: 'TapTap 公开评论样本',
            mvp_multi: 'Steam + TapTap 公开评论样本',
            imported: '用户导入经营指标 + 公开口碑',
        };

        // 客户端白名单净化：历史分享数据可能未经过服务端净化，渲染前再防一道
        const SAN_ALLOWED_TAGS = new Set(['P','BR','HR','H1','H2','H3','H4','H5','H6','UL','OL','LI','STRONG','EM','B','I','U','S','CODE','PRE','BLOCKQUOTE','TABLE','THEAD','TBODY','TR','TH','TD','A','IMG','SPAN','DIV','SMALL','SUP','SUB']);
        const SAN_DROP_CONTENT = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','TEMPLATE','NOSCRIPT']);
        const SAN_TAG_ATTRS = { A: ['href','title','target'], IMG: ['src','alt','title'] };

        function sanSafeUrl(value) {
            // 先剥 C0 控制符与 DEL：浏览器 URL 解析会丢前导控制符，"\x0ejavascript:" 可还原 scheme
            const url = String(value).replace(/[\x00-\x1f\x7f]/g, '').trim();
            const low = url.toLowerCase();
            if (/^(https?:|mailto:|#|\/)/.test(low) || low.startsWith('data:image/')) return url;
            if (!/^[a-z][a-z0-9+.-]*:/.test(low)) return url;
            return null;
        }

        function sanCopyChildren(src, dest) {
            for (const child of Array.from(src.childNodes)) {
                if (child.nodeType === Node.TEXT_NODE) {
                    dest.appendChild(document.createTextNode(child.nodeValue));
                } else if (child.nodeType === Node.ELEMENT_NODE) {
                    const tag = child.tagName;
                    if (SAN_DROP_CONTENT.has(tag)) continue;
                    if (!SAN_ALLOWED_TAGS.has(tag)) { sanCopyChildren(child, dest); continue; }
                    const el = document.createElement(tag);
                    const allowed = new Set([...(SAN_TAG_ATTRS[tag] || []), 'class']);
                    for (const attr of Array.from(child.attributes)) {
                        const name = attr.name.toLowerCase();
                        if (!allowed.has(name) || name.startsWith('on')) continue;
                        if ((name === 'href' || name === 'src')) {
                            const safe = sanSafeUrl(attr.value);
                            if (!safe) continue;
                            el.setAttribute(name, safe);
                        } else {
                            el.setAttribute(name, attr.value);
                        }
                    }
                    sanCopyChildren(child, el);
                    if (tag === 'A' && (el.getAttribute('target') || '').toLowerCase() === '_blank') {
                        el.setAttribute('rel', 'noopener noreferrer');
                    }
                    dest.appendChild(el);
                }
            }
        }

        function sanitizeHtml(raw) {
            const doc = new DOMParser().parseFromString(String(raw || ''), 'text/html');
            const out = document.createElement('div');
            sanCopyChildren(doc.body, out);
            return out.innerHTML;
        }

        async function load() {
            const el = document.getElementById('content');
            try {
                const res = await fetch('/api/report/shared/' + encodeURIComponent(token));
                const data = await res.json();
                if (!data.success) {
                    const p = document.createElement('p');
                    p.className = 'error';
                    p.textContent = data.message || '链接已过期';
                    el.replaceChildren(p);
                    return;
                }
                const report = data.report?.report_data || {};
                const platform = report.platform || '';
                const source = report.data_source || '';
                const hint = SOURCE_HINT[source] || (platform === 'taptap' ? 'TapTap 公开评论样本' : 'Steam 公开评论样本');
                document.getElementById('share-banner').textContent = '📎 分享报告 · ' + hint + ' · 仅供参考';
                document.getElementById('share-meta').textContent =
                    '类型：' + (data.report?.report_type || 'report') +
                    ' · 创建于 ' + ((data.report?.created_at || '').slice(0, 19));

                const snapshot = report.snapshot || report.snapshot_json || {};
                const structured = Object.assign({}, report, snapshot, {
                    success: true,
                    dimension_scores: report.dimension_scores || snapshot.dimension_scores,
                    facts: {
                        score_dimensions: snapshot.score_dimensions || report.score_dimensions,
                        dimension_scores: snapshot.dimension_scores || report.dimension_scores,
                    },
                    action_items: report.action_items || snapshot.action_items,
                    sections: report.sections || snapshot.sections,
                    executive_summary: report.executive_summary || snapshot.executive_summary,
                    data_source: report.data_source || snapshot.data_source,
                });

                if (structured.title || structured.executive_summary || structured.sections?.length) {
                    ScenarioReport.renderResult(el, structured);
                    const md = report.markdown || report.body_markdown || '';
                    if (md && window.MarkdownPreview) {
                        el.insertAdjacentHTML('beforeend', MarkdownPreview.render(md));
                    }
                    return;
                }

                const md = report.markdown || report.body_markdown || '';
                const html = report.html || report.html_excerpt || '';
                if (html) {
                    el.innerHTML = sanitizeHtml(html);
                } else if (md && window.MarkdownPreview) {
                    el.innerHTML = MarkdownPreview.render(md);
                } else if (md) {
                    el.innerHTML = '<pre style="white-space:pre-wrap;font-size:0.9rem;">' + md.replace(/</g, '&lt;') + '</pre>';
                } else {
                    const p = document.createElement('p');
                    p.textContent = report.executive_summary || '无内容';
                    el.replaceChildren(p);
                }
            } catch (e) {
                el.innerHTML = '<p class="error">加载失败</p>';
            }
        }
        load();
    </script>
</body>
</html>
